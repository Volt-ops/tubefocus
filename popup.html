<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TubeFocus</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div>
      <h1>TubeFocus</h1>
      <p id="status">Distractions hidden</p>
    </div>
    <label class="switch master" aria-label="Turn TubeFocus on or off">
      <input type="checkbox" id="enabled">
      <span class="track"></span>
    </label>
  </header>
  <main id="options"></main>
  <footer>Changes apply instantly on open YouTube tabs.</footer>
  <script src="defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
